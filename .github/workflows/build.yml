name: K7 ITsolutions remote builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        if: runner.os == 'Linux'
        run: unzip k7_itsolutions_source.zip -d source
      - name: Extract source
        if: runner.os == 'Windows'
        run: Expand-Archive -Path k7_itsolutions_source.zip -DestinationPath source
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Prepare Flutter platforms
        working-directory: source/apps/mobile
        run: flutter create --project-name k7_itsolutions --platforms=android,windows .
      - name: Install dependencies
        working-directory: source/apps/mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: source/apps/mobile
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test
      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: source/apps/mobile
        run: flutter build apk --release
      - name: Build Windows app
        if: matrix.target == 'windows'
        working-directory: source/apps/mobile
        run: flutter build windows --release
      - name: Upload Android artifact
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: k7-android
          path: source/apps/mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Windows artifact
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: k7-windows
          path: source/apps/mobile/build/windows/runner/Release/
